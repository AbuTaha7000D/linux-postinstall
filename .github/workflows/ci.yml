# .github/workflows/ci.yml - P10.3 CI.
#
# Three jobs:
#   lint      - shellcheck + shfmt via scripts/lint (P10.2)
#   unit      - bats + every fixture suite via tests/run (P10.1)
#   container - the [REAL] matrix: fedora:latest, fedora:41,
#               debian:stable, archlinux:latest, each a root container
#               running tests/containers/smoke.sh against the REAL package
#               backends of that distro.
#
# The container job is the only place the [REAL] container criterion is
# met. A green run here is a claim about GitHub Actions; a green
# tests/containers/smoke.sh run on a developer machine with podman is a
# DIFFERENT claim (local container execution) and is recorded separately
# in the ROADMAP P10.3 ledger row. Never conflate them.
#
# Why podman and not the `container:` job key: `container:` requires a
# node-compatible image and cannot express a matrix of four distro images
# that each run a shell suite as root. podman is preinstalled on
# ubuntu-latest runners and needs no privileged daemon.
#
# The lint job and the runner distro (P11-R D1, ROADMAP finding F2):
# the lint job stays on ubuntu-latest DELIBERATELY. Static analysis is
# shellcheck + shfmt only -- the project's code is never run here -- and after
# D1 both tools are pinned, SHA-256-verified static release binaries, so the
# lint RESULT is independent of the runner OS and identical to a Fedora
# workstation's. Moving this job to a Fedora image would add a container pull
# and a node-in-container dependency without changing a single lint outcome,
# and none of it could be verified without a real hosted run.
#
# This job was RED and unfixable before D1. scripts/install-tools.sh fetched
# shfmt with `dnf download shfmt` + `rpm2cpio | cpio`, which exist only on
# rpm-family hosts, so on this ubuntu runner the provisioning step always
# failed -- and failed SILENTLY, because `set -e` aborted the subshell before
# its "shfmt download failed" guard could print. It now provisions both tools
# from pinned upstream release assets and reports every failure explicitly.
# Do not "simplify" this step back into a package-manager install: that is the
# exact defect D1 fixed, and it is invisible until CI runs.
#
# Action pinning and job timeouts (P11-R D3, ROADMAP finding F4b):
# every action reference below is pinned to a full 40-hex commit SHA with the release
# version kept in a trailing comment -- the standard supply-chain practice,
# because a floating tag means the code CI executes can change underneath a
# green build with no diff in this repository. The SHA is the one
# refs/tags/v4 resolved to at pin time, verified 2026-10-04 with
# `git ls-remote --tags https://github.com/actions/checkout`, which reported
# refs/tags/v4 = refs/tags/v4.4.0 = 11d5960a326750d5838078e36cf38b85af677262.
# Pinning that exact commit is therefore a no-op for the first run and a
# freeze for every run after it. To move the pin: resolve the tag again,
# update all three call sites together, and say so in the D3 ledger row.
#
# Every job declares `timeout-minutes`, so a hung step cannot hold a hosted
# runner indefinitely. The values are measured, not guessed (host, 2026-10-04):
#   lint      20.9s locally (`make lint`), plus two pinned tool downloads
#             -> 15 min is ~40x headroom.
#   unit     208.3s locally for the whole `tests/run` battery
#             -> 30 min is ~9x headroom for a slower runner plus the bats
#                download.
#   container 150 min, and the relationship is load-bearing: FS_CTR_TIMEOUT is
#             5400s (90 min), and on that deadline the smoke script reports
#             INCONCLUSIVE and exits NON-ZERO. The job cap must stay ABOVE it,
#             or GitHub kills the step with a bare "exceeded timeout" and the
#             diagnosable failure this deadline exists to produce never happens.
#             The headroom above 90 min covers `podman pull` of the image plus
#             the in-container flatpak provisioning. Do NOT lower the job cap
#             to below FS_CTR_TIMEOUT, and do not raise either without evidence.
#
# This workflow has STILL NEVER EXECUTED on a GitHub runner: there is no run
# id and no status URL, and none may be invented (P10.3 row, P10 §9). Every
# number above is a LOCAL measurement. A first run must be read as a sample,
# not a verdict -- the shipped FS_CTR_TIMEOUT has already gone red on the
# Flathub CDN (see the container job comment).
#
# The repo is bind-mounted READ-ONLY into each container. That is a
# deliberate safety property, not an optimization: a container test that
# could write into the checkout could destroy the very tree CI is
# verifying (and the real install must not need to write there anyway --
# state lives off-repo under $HOME).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: provision pinned shellcheck + shfmt
        # Digest-verified static release binaries; no package manager, no
        # Fedora-only tooling, no `|| true` -- a provisioning failure fails
        # the job (scripts/install-tools.sh explains exactly which step and
        # which tool). See the D1 header note above.
        run: bash scripts/install-tools.sh
      - name: lint
        run: make lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install bats
        run: bash tests/install-bats.sh
      - name: unit + fixture suites
        run: bash tests/run

  container:
    name: container (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      # One distro failing must not hide the state of the others, and a
      # second failure of the same image is usually the same root cause.
      fail-fast: false
      matrix:
        include:
          # `slug` exists because a container name may not contain a colon
          # (`ctr-fedora:latest` is rejected by podman with "names must
          # match [a-zA-Z0-9][a-zA-Z0-9_.-]*"), and the image tag is exactly
          # what carries the colon. `family` is asserted by the smoke script
          # against `setup check`'s own output, so a distro-detection
          # regression fails in the job that covers it.
          - image: fedora:latest
            slug: fedora-latest
            family: rpm
          - image: fedora:41
            slug: fedora-41
            family: rpm
          - image: debian:stable
            slug: debian-stable
            family: deb
          - image: archlinux:latest
            slug: archlinux-latest
            family: arch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: pull image
        run: podman pull "docker.io/library/${{ matrix.image }}"
      - name: container smoke (real backends, as root)
        # -v "$PWD:/repo:ro"  read-only checkout (see header)
        # --privileged NOT used: nothing here needs it, and a container
        #   that can mount the host block device is not worth the risk.
        # FS_CTR_REAL: attempt the real install. The script's own
        #   no-flatpak SKIP path is unreachable from CI on purpose --
        #   provisioning below hard-fails if flatpak is missing, because a
        #   green job that silently skipped the [REAL] install would report
        #   coverage it did not deliver. The skip exists for hand-runs on a
        #   bare image, and prints its reason when it is used.
        # FS_CTR_TIMEOUT: an ENVIRONMENT deadline, not a verdict on the
        #   tool. Measured: the system+flatpak install of `minimal` pulls
        #   >2GB from Flathub, and that CDN varies ~10x -- an earlier
        #   Fedora run here exceeded 5400s, while a warm run finished in
        #   ~480-1000s. There is no headroom factor that makes this
        #   reliable; Flathub is a third party. On timeout the script
        #   reports INCONCLUSIVE and exits NON-ZERO rather than passing on
        #   unrun assertions, so a slow CDN fails the job loudly instead of
        #   quietly testing less than it reports. Raise this only with
        #   evidence; do not lower it to "stop the flakiness".
        run: |
          podman run --rm \
            --name "ctr-${{ matrix.slug }}" \
            -v "$PWD:/repo:ro" \
            -w /repo \
            -e HOME=/root \
            -e FS_CTR_FAMILY="${{ matrix.family }}" \
            -e FS_CTR_REAL=1 \
            -e FS_CTR_TIMEOUT=5400 \
            -i "docker.io/library/${{ matrix.image }}" \
            bash -c '
              set -u
              # Install flatpak where the image ships it as a package, so the
              # real-install path is actually exercised instead of skipped.
              #
              # NOTE the ID values, measured against these exact images:
              #   fedora:latest  -> ID=fedora
              #   fedora:41      -> ID=fedora
              #   debian:stable  -> ID=debian
              #   archlinux:latest -> ID=arch   (NOT "archlinux" -- the image
              #     is named archlinux but /etc/os-release says arch; an
              #     arm keyed on the image name matches NOTHING, and a case
              #     with no matching arm runs no command and still exits 0)
              # So the default arm reports loudly instead of doing nothing.
              ctr_id="$( . /etc/os-release 2>/dev/null && printf %s "${ID:-}" )"
              echo "container ID=$ctr_id"
              case "$ctr_id" in
                fedora) dnf install -y flatpak ;;
                debian|ubuntu) export DEBIAN_FRONTEND=noninteractive
                              apt-get update -qq
                              apt-get install -y -qq flatpak ;;
                arch) pacman -Sy --noconfirm flatpak ;;
                *) echo "::error::unhandled container ID=$ctr_id; no provisioning attempted" >&2
                   exit 1 ;;
              esac || { rc=$?
                        echo "::error::flatpak provisioning failed (rc $rc) on ID=$ctr_id; the [REAL] minimal install cannot run, so this matrix entry would silently deliver less coverage than it reports" >&2
                        exit "$rc"; }
              if command -v flatpak >/dev/null 2>&1; then
                echo "provisioned: flatpak $(flatpak --version)"
              else
                echo "::error::flatpak still absent after provisioning on ID=$ctr_id; the [REAL] minimal install cannot run" >&2
                exit 1
              fi
              bash tests/containers/smoke.sh
            '
